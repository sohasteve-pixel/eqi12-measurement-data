services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "18080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: eqi12-test-only
      POSTGRES_DB: eqi12
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eqi12"]
      interval: 10s
      timeout: 3s
      retries: 5

  cache:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
