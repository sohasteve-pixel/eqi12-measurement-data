services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: eqi12-jellyfin
    restart: unless-stopped
    ports:
      - "127.0.0.1:18096:8096"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ./media:/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8096/health"]
      interval: 15s
      timeout: 5s
      retries: 10
